name: Deploy to GitHub Pages

# Publishes the playable build from main. Needs Pages enabled with
# "GitHub Actions" as the source (repo Settings -> Pages).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The showcase's photographic assets (Poly Haven CC0, Khronos CC-BY) are downloaded, not
      # committed; cache them between deploys.
      - uses: actions/cache@v4
        with:
          path: public/content
          key: assets-${{ hashFiles('tools/assets/manifest.json', 'tools/assets/fetch.mjs') }}
      - run: npm run assets
      - run: npx vite build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
