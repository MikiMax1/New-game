name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx vite build

  # The Unity project, checked without Unity: C# against Unity 6.0 and HDRP 17.0 source, and the
  # compute shaders' kernels with glslang (see tools/unity-check).
  unity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq glslang-tools
      - uses: actions/cache@v4
        with:
          path: .cache/unity-check
          key: unity-check-${{ hashFiles('tools/unity-check/check.sh') }}
      - run: tools/unity-check/check.sh
